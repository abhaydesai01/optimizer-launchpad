<!doctype html>
<html><head><meta charset="utf-8"><title>Phone preview</title>
<style>html,body{margin:0;background:#d9dcda;font:13px system-ui} #f{position:fixed;left:30px;top:10px;width:390px;height:700px;border:0;border-radius:16px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.25)}</style></head>
<body><iframe id="f"></iframe>
<script>
const fr = document.getElementById("f");
window.__open = (u) => { fr.src = u + (u.includes("?") ? "&" : "?") + "p=" + Date.now(); return "loading"; };
window.__y = async (y, w = 1200) => { const W = fr.contentWindow, y0 = W.scrollY; for (let k = 1; k <= 10; k++) { W.scrollTo(0, y0 + (y - y0) * k / 10); await new Promise(r => setTimeout(r, 50)); } await new Promise(r => setTimeout(r, w)); return [Math.round(W.scrollY), W.document.documentElement.scrollHeight]; };
window.__q = (sel) => { const d = fr.contentDocument, e = d.querySelector(sel); if (!e) return null; const r = e.getBoundingClientRect(); return Math.round(r.top + fr.contentWindow.scrollY); };
</script></body></html>
